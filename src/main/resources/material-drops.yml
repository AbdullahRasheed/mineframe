# FrameMaterial drop rules are loaded and cached when the plugin starts.
#
# range accepts "minimum,maximum", [minimum, maximum], or a single amount.
# chance is a decimal from 0.0 to 1.0.
#
# Optional block-state conditions use the property names shown in Minecraft's
# block data. Crops support the convenient age: max value:
#
# future_crop_material:
#   potatoes:
#     chance: 0.25
#     range: "1,3"
#     conditions:
#       age: max

selite:
  coal_ore:
    chance: 0.65
    range: "3,12"
  iron_ore:
    chance: 0.7
    range: "4,18"
thorin:
  copper_ore:
    chance: 0.7
    range: "8,23"
  stone:
    chance: 0.09
    range: "2,8"
glucon:
  potatoes:
    chance: 0.30
    range: "1,4"
  wheat:
    chance: 0.30
    range: "1,4"
  carrots:
    chance: 0.30
    range: "1,4"
  beetroots:
    chance: 0.40
    range: "1,2"